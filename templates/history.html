<!DOCTYPE html>
<html>
<head>
    <title>Workout History</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        h1 {
            color: #00e676;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 60%;
        }
        th, td {
            border: 1px solid #444;
            padding: 10px;
        }
        th {
            background-color: #00e676;
            color: #121212;
        }
        a.button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #00e676;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Workout History</h1>
    <table>
        <tr>
            <th>Exercise</th>
            <th>Reps</th>
            <th>Date</th>
        </tr>
        {% for row in workouts %}
        <tr>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
        </tr>
        {% endfor %}
    </table>

    <canvas id="progressChart" width="600" height="300" style="margin: 30px auto; display: block;"></canvas>

    <a href="/" class="button">Back to Tracker</a>

    <script>
        const ctx = document.getElementById('progressChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: {{ bicep_dates | tojson }},
                datasets: [
                    {
                        label: 'Bicep Curl Reps',
                        data: {{ bicep_reps | tojson }},
                        borderColor: '#00e676',
                        fill: false
                    },
                    {
                        label: 'Squat Reps',
                        data: {{ squat_reps | tojson }},
                        borderColor: '#2196f3',
                        fill: false
                    }
                ]
            }
        });
    </script>
</body>
</html>
