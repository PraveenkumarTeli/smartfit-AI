<!DOCTYPE html>
<html>
<head>
    <title>Login - SmartFit AI</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        h1 {
            color: #00e676;
        }
        input {
            padding: 10px;
            margin: 10px;
            border-radius: 6px;
            border: none;
            width: 200px;
        }
        button {
            padding: 12px 24px;
            background-color: #00e676;
            color: #121212;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Login</h1>
    <form method="POST">
        <br>
        <input type="text" name="username" placeholder="Username" required>
        <br>
        <input type="password" name="password" placeholder="Password" required>
        <br>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="/register" style="color: #00e676;">Register here</a></p>
</body>
</html>
